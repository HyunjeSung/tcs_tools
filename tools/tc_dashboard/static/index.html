<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AC Gen2 EMS TC Dashboard</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171d2e; --border: #2a3348; --text: #e6e9f0;
    --muted: #8891a7; --pass: #2ecc71; --fail: #e74c3c; --warn: #f39c12; --accent: #4d8dff;
    --btn-bg: #1e2740; --log-bg: #0a0e17; --hover-bg: #1c2438; --selected-bg: #22304f;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f9; --panel: #ffffff; --border: #dde1eb; --text: #1a2033;
    --muted: #6b7280; --pass: #1a9850; --fail: #d63b2f; --warn: #c9770a; --accent: #2f6fed;
    --btn-bg: #eef1f8; --log-bg: #f7f8fb; --hover-bg: #eef1f8; --selected-bg: #e2e8f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, "Segoe UI", Pretendard, sans-serif;
         background: var(--bg); color: var(--text); font-size: 14px; }

  /* ---------- app shell (sidebar + content) ---------- */
  .app-shell { display: flex; min-height: 100vh; align-items: stretch; position: relative; }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--panel);
             display: flex; flex-direction: column; overflow: hidden;
             transition: width .18s ease; }
  /* 접으면 아이콘 레일이 아니라 완전히 사라짐 — 남는 건 아래 고정 토글 버튼 하나뿐. */
  .sidebar.collapsed { width: 0; }
  .sidebar-head { display: flex; align-items: center; justify-content: center; gap: 8px;
                  padding: 14px 12px 14px 46px; min-height: 51px; }
  .sidebar-head .brand { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase;
                          letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 사이드바 안팎 어디서든 같은 자리(좌상단 고정)에 떠서 접기/펼치기를 담당하는 버튼.
     배경 없이 아이콘만 반투명하게 숨죽이고 있다가 hover하면 또렷해짐 — cursor.com/agents 스타일 참고. */
  .floating-toggle { position: fixed; top: 14px; left: 14px; z-index: 100;
                      background: none; border: 1px solid transparent; color: var(--muted);
                      border-radius: 7px; padding: 7px; cursor: pointer;
                      display: flex; align-items: center; justify-content: center;
                      opacity: .5; box-shadow: none;
                      transition: opacity .15s ease, border-color .15s ease, color .15s ease, background .15s ease; }
  .floating-toggle:hover { opacity: 1; background: var(--hover-bg); color: var(--text); }
  .floating-toggle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .app-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 3px; }
  .app-item { display: flex; align-items: center; gap: 10px; padding: 8px 9px; border-radius: 7px;
              cursor: pointer; color: var(--text); border: 1px solid transparent; white-space: nowrap; }
  .app-item:hover { background: var(--hover-bg); }
  .app-item.active { background: var(--selected-bg); color: var(--accent); }
  .app-item .avatar { width: 26px; height: 26px; border-radius: 7px; background: var(--btn-bg);
                       display: flex; align-items: center; justify-content: center; font-size: 11px;
                       font-weight: 700; flex-shrink: 0; color: var(--muted); }
  .app-item.active .avatar { background: var(--accent); color: #fff; }
  .app-item .meta { min-width: 0; overflow: hidden; }
  .app-item .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-item .sub { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-item.active .sub { color: var(--accent); opacity: .8; }
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; transition: padding-left .18s ease; }
  /* 사이드바가 접히면 고정 토글 버튼이 헤더 타이틀과 같은 자리에 겹치므로, 접힌 동안만
     content 전체를 버튼 폭만큼 오른쪽으로 밀어낸다 (펼쳐진 상태는 사이드바 자체가 이미
     공간을 차지하므로 그대로 둠). */
  .sidebar.collapsed ~ .content { padding-left: 46px; }

  header { display: flex; align-items: center; justify-content: space-between;
           padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; }
  header .dut { font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: var(--pass); } .dot.off { background: var(--fail); }
  .dot.unknown { background: var(--muted); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 24px; align-content: start; }
  main > section, main > .right-col { min-width: 0; }
  .cards { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 4px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
  .card .num { font-size: 24px; font-weight: 700; }
  .card .lbl { font-size: 12px; color: var(--muted); }
  .card.pass .num { color: var(--pass); } .card.fail .num { color: var(--fail); }
  .card.skip .num { color: var(--warn); }
  .last-run-line { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin: -6px 0 4px; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  section h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tc-btn { display: block; width: 100%; text-align: left; background: var(--btn-bg); border: 1px solid var(--border);
            color: var(--text); padding: 9px 10px; border-radius: 6px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
  .tc-btn:hover:not(:disabled) { border-color: var(--accent); }
  .tc-btn:disabled { opacity: .45; cursor: not-allowed; }
  .tc-btn .note { display: block; font-size: 11px; color: var(--warn); margin-top: 2px; }
  .empty-hint { font-size: 12.5px; color: var(--muted); padding: 6px 2px; }
  .custom-hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .custom-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .custom-dropdown { position: relative; margin-bottom: 10px; }
  .custom-dropdown-btn { width: 100%; display: flex; align-items: center; justify-content: space-between;
                          gap: 8px; background: var(--btn-bg); border: 1px solid var(--border); color: var(--text);
                          padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: left; }
  .custom-dropdown-btn:hover:not(:disabled) { border-color: var(--accent); }
  .custom-dropdown-btn:disabled { opacity: .45; cursor: not-allowed; }
  .custom-dropdown-btn .placeholder { color: var(--muted); }
  .custom-dropdown-btn .caret { width: 13px; height: 13px; flex-shrink: 0; stroke: currentColor; fill: none;
                                 stroke-width: 2.5; transition: transform .15s ease; }
  .custom-dropdown.open .custom-dropdown-btn { border-color: var(--accent); }
  .custom-dropdown.open .custom-dropdown-btn .caret { transform: rotate(180deg); }
  .custom-dropdown-panel { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
                            background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
                            padding: 6px; max-height: 260px; overflow-y: auto; z-index: 20;
                            box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .custom-dropdown.open .custom-dropdown-panel { display: block; }
  .custom-item { padding: 7px 8px; border-radius: 5px; cursor: pointer; font-size: 13px; user-select: none; }
  .custom-item:hover { background: var(--hover-bg); }
  .custom-item.selected { background: var(--selected-bg); color: var(--accent); font-weight: 600; }
  .custom-actions { display: flex; gap: 8px; align-items: center; }
  .custom-actions button.link { background: none; border: none; color: var(--accent); cursor: pointer;
                                 font-size: 12px; padding: 0; text-decoration: underline; }
  #customRunBtn { flex: 1; background: var(--accent); border: none; color: #fff; padding: 9px 10px;
                  border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  #customRunBtn:disabled { opacity: .45; cursor: not-allowed; }
  .right-col { display: flex; flex-direction: column; gap: 16px; }
  #log { background: var(--log-bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px;
         font-family: "SF Mono", Consolas, monospace; font-size: 12px; white-space: pre-wrap;
         overflow-wrap: anywhere; max-height: 340px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border);
           overflow-wrap: anywhere; }
  th { color: var(--muted); font-weight: 500; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.PASS, .badge.pass { background: rgba(46,204,113,.15); color: var(--pass); }
  .badge.FAIL, .badge.fail { background: rgba(231,76,60,.15); color: var(--fail); }
  .badge.SKIP, .badge.skip { background: rgba(243,156,18,.15); color: var(--warn); }
  .badge.running { background: rgba(77,141,255,.15); color: var(--accent); }
  .badge.timeout, .badge.error { background: rgba(243,156,18,.15); color: var(--warn); }
  .badge.rebooted { background: rgba(243,156,18,.15); color: var(--warn); }
  .badge.interrupted { background: rgba(231,76,60,.12); color: var(--warn); }
  .badge.cancelled { background: rgba(231,76,60,.12); color: var(--warn); }
  .stop-btn { margin-left: 8px; width: 22px; height: 22px; padding: 0; border-radius: 5px;
    border: 1px solid var(--muted); color: var(--muted); background: var(--btn-bg); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
  .stop-btn::before { content: ""; width: 8px; height: 8px; background: currentColor; }
  .stop-btn:hover { background: var(--hover-bg); }
  .stop-btn:disabled { opacity: .4; cursor: default; }
  .badge.channel-ssh { background: rgba(77,141,255,.15); color: var(--accent); }
  .badge.channel-serial { background: rgba(46,204,113,.15); color: var(--pass); }
  .run-row { cursor: pointer; }
  .run-row:hover { background: var(--hover-bg); }
  .run-row.selected { background: var(--selected-bg); }
  .muted { color: var(--muted); }
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; font-size: 12.5px; }
  .pager button { background: var(--btn-bg); border: 1px solid var(--border); color: var(--text);
                  padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
  .pager button:hover:not(:disabled) { border-color: var(--accent); }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  #themeToggle { position: relative; width: 44px; height: 22px; margin-left: 12px; padding: 0 4px;
                 display: inline-flex; align-items: center; justify-content: space-between;
                 background: var(--panel); border: 1px solid var(--border); border-radius: 11px;
                 cursor: pointer; vertical-align: middle; }
  #themeToggle:hover { border-color: var(--accent); }
  #themeToggle svg { width: 12px; height: 12px; color: var(--muted); position: relative; z-index: 1;
                      opacity: 0; stroke-width: 2; transition: opacity .15s ease, color .15s ease; }
  #themeToggle .thumb { position: absolute; top: 1px; left: 1px; width: 18px; height: 18px; border-radius: 50%;
                         box-shadow: 0 1px 3px rgba(0,0,0,.35);
                         transition: transform .18s ease, background .18s ease; }
  #themeToggle[data-active="light"] .thumb { transform: translateX(0); background: var(--muted); }
  #themeToggle[data-active="dark"] .thumb { transform: translateX(22px); background: var(--btn-bg); }
  #themeToggle[data-active="light"] .icon-sun,
  #themeToggle[data-active="dark"] .icon-moon { opacity: 1; color: #fff; stroke-width: 2.5; }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <button id="sidebarToggle" class="floating-toggle" type="button" title="사이드바 접기/펼치기">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <div class="brand">Unified Edge APPS</div>
    </div>
    <nav id="appList" class="app-list"></nav>
  </aside>

  <div class="content">
    <header>
      <h1 id="pageTitle">system_log TC Dashboard</h1>
      <div class="dut"><span id="dutDot" class="dot unknown" title="연결 상태 미확인 — 아직 실행 이력 없음"></span>DUT 192.168.10.25 <span id="channelBadge" class="badge channel-ssh" title="TC 실행에 사용되는 연결 채널">SSH</span>
        <button id="themeToggle" type="button" title="테마 전환">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <span class="thumb"></span>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <div class="cards">
        <div class="card"><div class="num" id="cardTotal">-</div><div class="lbl">전체 케이스</div></div>
        <div class="card pass"><div class="num" id="cardPass">-</div><div class="lbl">PASS</div></div>
        <div class="card fail"><div class="num" id="cardFail">-</div><div class="lbl">FAIL</div></div>
        <div class="card skip"><div class="num" id="cardSkip">-</div><div class="lbl">SKIP</div></div>
      </div>
      <div class="last-run-line">최근 실행: <span id="cardLast">-</span></div>

      <section>
        <h2>TC 실행</h2>

        <div id="customSection">
          <div class="custom-label" id="customLabel">선택 실행</div>
          <div id="customDropdown" class="custom-dropdown">
            <button id="customDropdownBtn" type="button" class="custom-dropdown-btn">
              <span id="customDropdownLabel" class="placeholder">TC 선택...</span>
              <svg class="caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div id="customDropdownPanel" class="custom-dropdown-panel">
              <div id="customList"></div>
            </div>
          </div>
          <div class="custom-actions">
            <button id="customRunBtn" type="button" disabled>선택 실행</button>
          </div>
          <hr class="custom-hr">
        </div>

        <div id="catalogButtons"></div>
      </section>

      <div class="right-col">
        <section>
          <h2>실행 로그 <span id="runningLabel" class="muted"></span></h2>
          <div id="log">실행할 TC를 선택하세요.</div>
        </section>

        <section>
          <h2>결과 현황판 <span id="statusLabel" class="muted">(최신 케이스별)</span></h2>
          <table id="statusTable">
            <thead><tr><th>TC</th><th>Case</th><th>설명</th><th>결과</th><th>Run</th><th>시각</th></tr></thead>
            <tbody></tbody>
          </table>
        </section>

        <section>
          <h2>실행 이력</h2>
          <table id="historyTable">
            <thead><tr><th>Run ID</th><th>대상</th><th>채널</th><th>상태</th><th>PASS/FAIL/SKIP</th><th>시작</th><th>종료</th><th>소요시간</th><th>결과</th></tr></thead>
            <tbody></tbody>
          </table>
          <div id="historyPager" class="pager"></div>
        </section>
      </div>
    </main>
  </div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeToggle').setAttribute('data-active', theme);
  localStorage.setItem('theme', theme);
}
$('#themeToggle').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(next);
};
applyTheme(localStorage.getItem('theme') || 'dark');

// ---------- sidebar ----------
function applySidebarState(collapsed) {
  $('#sidebar').classList.toggle('collapsed', collapsed);
  localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0');
}
$('#sidebarToggle').onclick = () => {
  applySidebarState(!$('#sidebar').classList.contains('collapsed'));
};
applySidebarState(localStorage.getItem('sidebarCollapsed') === '1');

let apps = [];               // /api/apps 결과 캐시
let currentAppId = localStorage.getItem('appId') || 'system_log';
let currentAppLabel = currentAppId;
let currentAppHasCustom = false;

function renderAppList() {
  const list = $('#appList');
  list.innerHTML = '';
  apps.forEach(a => {
    const item = document.createElement('div');
    item.className = 'app-item' + (a.id === currentAppId ? ' active' : '');
    item.title = a.label;
    item.innerHTML = `<div class="avatar">${escapeHtml(a.label.slice(0, 2).toUpperCase())}</div>
      <div class="meta"><div class="name">${escapeHtml(a.label)}</div></div>`;
    item.onclick = () => { if (a.id !== currentAppId) switchApp(a.id); };
    list.appendChild(item);
  });
}

async function loadApps() {
  apps = await fetch('/api/apps').then(r => r.json());
  if (!apps.find(a => a.id === currentAppId)) {
    currentAppId = apps.length ? apps[0].id : 'system_log';
  }
  renderAppList();
}

async function switchApp(appId) {
  currentAppId = appId;
  localStorage.setItem('appId', appId);
  selectedRunId = null;
  selectedCustom = null;
  historyPage = 1;
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  renderAppList();
  await refreshAppMeta();
  $('#log').textContent = '실행할 TC를 선택하세요.';
  $('#runningLabel').textContent = '';
  $('#statusLabel').textContent = '(최신 케이스별)';
  await Promise.all([loadCustomOptions(), loadCatalogButtons(), refreshStatus(), refreshHistory()]);
  await initDutState();
}

async function refreshAppMeta() {
  const meta = apps.find(a => a.id === currentAppId);
  currentAppLabel = meta ? meta.label : currentAppId;
  currentAppHasCustom = meta ? meta.has_custom : false;
  $('#pageTitle').textContent = `${currentAppLabel} TC Dashboard`;
  $('#customSection').style.display = currentAppHasCustom ? '' : 'none';
}

let pollTimer = null;
let selectedRunId = null;   // 실행 이력에서 클릭해 선택한 run (없으면 전체 최신 현황판 표시)
let selectedChannel = 'ssh';   // 다음 실행에 쓸 채널 (ssh/serial) — 항상 ssh로 시작, 버튼 클릭으로만 전환(새로고침하면 초기화)
let historyPage = 1;
const HISTORY_PAGE_SIZE = 10;

function applyChannelBadge() {
  const badge = $('#channelBadge');
  badge.textContent = selectedChannel.toUpperCase();
  badge.className = 'badge channel-' + selectedChannel;
  badge.title = `클릭해서 전환 (다음 실행에 사용될 채널) — 현재: ${selectedChannel.toUpperCase()}`;
}
$('#channelBadge').onclick = () => {
  selectedChannel = selectedChannel === 'ssh' ? 'serial' : 'ssh';
  applyChannelBadge();
};
$('#channelBadge').style.cursor = 'pointer';
applyChannelBadge();

let selectedCustom = null;   // 단일 선택 — 선택된 TC id 하나 또는 null

function updateCustomUi() {
  const labelEl = $('#customDropdownLabel');
  if (selectedCustom) {
    labelEl.textContent = selectedCustom;
    labelEl.classList.remove('placeholder');
  } else {
    labelEl.textContent = 'TC 선택...';
    labelEl.classList.add('placeholder');
  }
  $('#customRunBtn').disabled = !selectedCustom;
  document.querySelectorAll('#customList .custom-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === selectedCustom);
  });
}

function openCustomDropdown(open) {
  $('#customDropdown').classList.toggle('open', open);
}

async function loadCustomOptions() {
  if (!currentAppHasCustom) { $('#customList').innerHTML = ''; return; }
  const tcs = await fetch(`/api/custom_tcs?app_id=${encodeURIComponent(currentAppId)}`).then(r => r.json());
  $('#customLabel').textContent = `선택 실행 (${tcs.map(t => t.id).join(', ')} 중 1개 선택)`;
  const list = $('#customList');
  list.innerHTML = '';
  tcs.forEach(tc => {
    const item = document.createElement('div');
    item.className = 'custom-item';
    item.dataset.id = tc.id;
    item.textContent = tc.id;
    item.onclick = () => {
      selectedCustom = tc.id;
      updateCustomUi();
      openCustomDropdown(false);
    };
    list.appendChild(item);
  });
  updateCustomUi();
}

$('#customDropdownBtn').onclick = (e) => {
  e.stopPropagation();
  openCustomDropdown(!$('#customDropdown').classList.contains('open'));
};
$('#customDropdownPanel').onclick = (e) => e.stopPropagation();   // 패널 안 클릭은 바깥클릭 취급 안 함
document.addEventListener('click', () => openCustomDropdown(false));

$('#customRunBtn').onclick = () => runCustomTc();

// 앱마다 지원하는 catalog(=/api/tcs)가 다르므로 버튼을 고정 HTML이 아니라 매번 새로 그린다.
async function loadCatalogButtons() {
  const tcs = await fetch(`/api/tcs?app_id=${encodeURIComponent(currentAppId)}`).then(r => r.json());
  const container = $('#catalogButtons');
  container.innerHTML = '';
  if (!tcs.length) {
    container.innerHTML = '<div class="empty-hint">등록된 TC가 없습니다.</div>';
    return;
  }
  tcs.forEach(tc => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tc-btn';
    btn.dataset.tcId = tc.id;
    btn.innerHTML = escapeHtml(tc.label) + (tc.note ? `<span class="note">${escapeHtml(tc.note)}</span>` : '');
    btn.onclick = () => runTc(tc.id, btn);
    container.appendChild(btn);
  });
}

function setButtonsDisabled(disabled) {
  document.querySelectorAll('#catalogButtons .tc-btn').forEach(b => b.disabled = disabled);
  $('#customDropdownBtn').disabled = disabled;
  $('#customRunBtn').disabled = disabled || !selectedCustom;
  if (disabled) openCustomDropdown(false);
}

async function runTc(tcId, btn) {
  setButtonsDisabled(true);
  $('#log').textContent = `[${tcId}] 시작 중...`;
  try {
    const res = await fetch('/api/run', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app_id: currentAppId, tc_id: tcId, channel: selectedChannel }),
    });
    if (!res.ok) {
      const err = await res.json();
      $('#log').textContent = `실행 실패: ${err.detail}`;
      setButtonsDisabled(false);
      return;
    }
    const { run_id } = await res.json();
    selectedRunId = run_id;   // 방금 시작한 run 을 현황판에 바로 반영
    $('#runningLabel').textContent = `— ${run_id}`;
    historyPage = 1;   // 방금 시작한 run이 이력 1페이지 맨 위에 오도록
    refreshHistory();
    pollRun(run_id);
  } catch (e) {
    $('#log').textContent = `요청 오류: ${e}`;
    setButtonsDisabled(false);
  }
}

async function runCustomTc() {
  if (!selectedCustom) return;
  setButtonsDisabled(true);
  $('#log').textContent = `[선택 실행: ${selectedCustom}] 시작 중...`;
  try {
    const res = await fetch('/api/run', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app_id: currentAppId, tc_id: 'custom', tc_ids: [selectedCustom], channel: selectedChannel }),
    });
    if (!res.ok) {
      const err = await res.json();
      $('#log').textContent = `실행 실패: ${err.detail}`;
      setButtonsDisabled(false);
      return;
    }
    const { run_id } = await res.json();
    selectedRunId = run_id;
    $('#runningLabel').textContent = `— ${run_id}`;
    historyPage = 1;
    refreshHistory();
    pollRun(run_id);
  } catch (e) {
    $('#log').textContent = `요청 오류: ${e}`;
    setButtonsDisabled(false);
  }
}

// ping은 DUT 전원/네트워크만 확인할 뿐 SSH/시리얼 연결 성공을 보장하지 않으므로,
// run 완료/조회 시점마다 실제 연결 결과(exit_code)로 DUT 점을 갱신한다.
// exit_code가 null이면 연결 자체가 실패한 것(TC PASS/FAIL 여부와 무관).
function applyConnectionState(runId, meta) {
  const connectionOk = meta.exit_code !== null;
  $('#dutDot').className = 'dot ' + (connectionOk ? 'on' : 'off');
  $('#dutDot').title = connectionOk
    ? `${runId} 연결 성공`
    : `${runId} 연결 실패 (SSH/시리얼 확인 필요)`;
}

// 히스토리 표의 상태 배지 옆 "중지" 버튼(row.status === 'running'일 때만 렌더링됨)에서 호출.
// 버튼은 refreshHistory()가 매번 다시 그리므로 여기선 진행 중 표시만 하면 되고,
// 성공하면 다음 refreshHistory()/poll tick에서 status가 바뀌어 버튼이 자연히 사라진다.
async function stopRun(runId, btnEl) {
  btnEl.disabled = true;
  btnEl.title = '중지 중...';
  try {
    const res = await fetch(`/api/runs/${runId}/stop`, { method: 'POST' });
    if (!res.ok) {
      const err = await res.json();
      alert(`중지 실패: ${err.detail}`);
      btnEl.disabled = false;
      btnEl.title = '중지';
    }
  } catch (e) {
    alert(`중지 요청 오류: ${e}`);
    btnEl.disabled = false;
    btnEl.title = '중지';
  }
}

async function pollRun(runId) {
  if (pollTimer) clearInterval(pollTimer);
  const appIdAtStart = currentAppId;
  pollTimer = setInterval(async () => {
    if (currentAppId !== appIdAtStart) { clearInterval(pollTimer); return; }   // 폴링 중 다른 앱으로 전환하면 중단
    const data = await fetch(`/api/runs/${runId}?app_id=${encodeURIComponent(appIdAtStart)}`).then(r => r.json());
    renderRunView(runId, data);
    if (data.meta.status !== 'running') {
      clearInterval(pollTimer);
      setButtonsDisabled(false);
      applyConnectionState(runId, data.meta);
      refreshStatus();   // 요약 카드만 갱신 — 현황판 표는 selectedRunId 가 있으면 그대로 유지
      refreshHistory();
    }
  }, 1500);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderStatusRows(rows) {
  const tbody = $('#statusTable tbody');
  tbody.innerHTML = '';
  rows.forEach(v => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${v.tc}</td><td>${v.case}</td><td>${escapeHtml(v.desc)}</td>
      <td><span class="badge ${v.status}">${v.status}</span></td>
      <td class="muted">${v.run_id || ''}</td><td class="muted">${(v.at || '').replace('T', ' ')}</td>`;
    tbody.appendChild(tr);
  });
}

function highlightSelectedRow() {
  document.querySelectorAll('#historyTable .run-row').forEach(tr => {
    tr.classList.toggle('selected', tr.dataset.runId === selectedRunId);
  });
}

// 특정 run 의 로그 + 결과 현황판을 함께 갱신 (실행 이력 클릭 / 진행중인 run 폴링 공용)
function renderRunView(runId, data) {
  $('#log').textContent = data.log || '(출력 없음)';
  $('#log').scrollTop = $('#log').scrollHeight;
  $('#runningLabel').textContent = `— ${runId} (${data.meta.status})`;

  const rows = (data.cases || []).map(c => ({ ...c, run_id: runId, at: data.meta.finished_at || '' }));
  renderStatusRows(rows);
  $('#statusLabel').textContent = `(${runId} 기준)`;

  highlightSelectedRow();
}

async function refreshStatus() {
  const status = await fetch(`/api/status?app_id=${encodeURIComponent(currentAppId)}`).then(r => r.json());
  const entries = Object.entries(status).sort(([a], [b]) => a.localeCompare(b, undefined, { numeric: true }));
  let pass = 0, fail = 0, skip = 0, lastAt = null;
  const rows = entries.map(([caseId, v]) => {
    if (v.status === 'PASS') pass++; else if (v.status === 'FAIL') fail++; else if (v.status === 'SKIP') skip++;
    if (!lastAt || v.at > lastAt) lastAt = v.at;
    return { ...v, case: caseId };
  });
  $('#cardTotal').textContent = rows.length;
  $('#cardPass').textContent = pass;
  $('#cardFail').textContent = fail;
  $('#cardSkip').textContent = skip;
  $('#cardLast').textContent = lastAt ? lastAt.replace('T', ' ') : '-';
  if (!selectedRunId) renderStatusRows(rows);   // 특정 run 선택 중이면 그 표를 덮어쓰지 않음
}

function formatDuration(startIso, endIso) {
  if (!startIso || !endIso) return '-';
  const secs = Math.round((new Date(endIso) - new Date(startIso)) / 1000);
  if (secs < 0 || Number.isNaN(secs)) return '-';
  const m = Math.floor(secs / 60), s = secs % 60;
  return m > 0 ? `${m}분 ${s}초` : `${s}초`;
}

function renderHistoryPager(page, totalPages) {
  const pager = $('#historyPager');
  pager.innerHTML = '';
  if (totalPages <= 1) return;
  const prevBtn = document.createElement('button');
  prevBtn.textContent = '이전';
  prevBtn.disabled = page <= 1;
  prevBtn.onclick = () => { historyPage--; refreshHistory(); };
  const label = document.createElement('span');
  label.className = 'muted';
  label.textContent = `${page} / ${totalPages}`;
  const nextBtn = document.createElement('button');
  nextBtn.textContent = '다음';
  nextBtn.disabled = page >= totalPages;
  nextBtn.onclick = () => { historyPage++; refreshHistory(); };
  pager.append(prevBtn, label, nextBtn);
}

async function refreshHistory() {
  const appIdAtCall = currentAppId;
  const { runs, total, page } = await fetch(`/api/runs?app_id=${encodeURIComponent(appIdAtCall)}&page=${historyPage}&page_size=${HISTORY_PAGE_SIZE}`).then(r => r.json());
  if (appIdAtCall !== currentAppId) return;   // 응답 도착 전에 다른 앱으로 전환됐으면 버림
  const tbody = $('#historyTable tbody');
  tbody.innerHTML = '';
  runs.forEach(r => {
    const tr = document.createElement('tr');
    tr.className = 'run-row';
    tr.dataset.runId = r.run_id;
    const dlCell = r.finished_at
      ? `<a href="/api/runs/${r.run_id}/result.pdf?app_id=${encodeURIComponent(appIdAtCall)}" download class="muted" style="text-decoration:underline;" onclick="event.stopPropagation()">다운로드</a>`
      : '-';
    const channel = r.channel || 'ssh';
    const stopCell = r.status === 'running'
      ? `<button class="stop-btn" type="button" title="중지" data-run-id="${r.run_id}" onclick="event.stopPropagation(); stopRun('${r.run_id}', this)"></button>`
      : '';
    tr.innerHTML = `<td>${r.run_id}</td><td>${r.label || r.tc_id}</td>
      <td><span class="badge channel-${channel}">${channel.toUpperCase()}</span></td>
      <td><span class="badge ${r.status}">${r.status}</span>${stopCell}</td>
      <td>${r.pass}/${r.fail}/${r.skip || 0}</td><td class="muted">${(r.started_at || '').replace('T', ' ')}</td>
      <td class="muted">${r.finished_at ? r.finished_at.replace('T', ' ') : '진행중'}</td>
      <td class="muted">${r.finished_at ? formatDuration(r.started_at, r.finished_at) : '-'}</td>
      <td>${dlCell}</td>`;
    tr.onclick = () => showRunLog(r.run_id);
    tbody.appendChild(tr);
  });
  highlightSelectedRow();
  renderHistoryPager(page, Math.max(1, Math.ceil(total / HISTORY_PAGE_SIZE)));
}

async function showRunLog(runId) {
  selectedRunId = runId;
  const data = await fetch(`/api/runs/${runId}?app_id=${encodeURIComponent(currentAppId)}`).then(r => r.json());
  renderRunView(runId, data);
  if (data.meta.status !== 'running') applyConnectionState(runId, data.meta);
}

// ping은 전원/네트워크만 확인할 뿐 SSH 가능 여부를 보장하지 않아 오히려 오해를 준다
// (ping은 되는데 SSH는 lockout으로 타임아웃나는 상황에서도 초록불이 떠버림) — 그래서 안 쓴다.
// 페이지 로드 시엔 가장 최근 run의 실제 연결 결과로 LED를 초기화한다.
async function initDutState() {
  const { runs } = await fetch(`/api/runs?app_id=${encodeURIComponent(currentAppId)}&page=1&page_size=1`).then(r => r.json());
  if (runs.length > 0 && runs[0].status !== 'running') {
    applyConnectionState(runs[0].run_id, runs[0]);
  } else if (runs.length === 0) {
    $('#dutDot').className = 'dot unknown';
    $('#dutDot').title = '연결 상태 미확인 — 아직 실행 이력 없음';
  } else if (runs[0].status === 'running') {
    // 새로고침 시점에 이미 진행 중인 run이 있으면(이 탭에서 시작했든 아니든)
    // 실행 로그/중지 버튼을 그 run 기준으로 다시 붙인다.
    selectedRunId = runs[0].run_id;
    setButtonsDisabled(true);
    pollRun(runs[0].run_id);
  }
}

async function init() {
  await loadApps();
  await refreshAppMeta();
  await Promise.all([loadCustomOptions(), loadCatalogButtons(), refreshStatus(), refreshHistory()]);
  await initDutState();
  // 다른 클라이언트가 실행 중일 수도 있으니 주기적으로 이력만 새로고침
  setInterval(refreshHistory, 15000);
}
init();
</script>
